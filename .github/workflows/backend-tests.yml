name: backend-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # Прогон занимает ~3 минуты. Ограничение нужно потому, что в наборе есть тесты,
    # берущие настоящие блокировки (`FOR UPDATE` в ручном матчинге, пакетная
    # разметка в одной транзакции) и тесты с настоящей конкуренцией потоков:
    # взаимная блокировка повесила бы job на дефолтные 6 часов GitHub. Тот же приём
    # уже применён в frontend-tests.yml.
    timeout-minutes: 20

    # Postgres + pgvector on the runner itself → localhost queries (~0.1ms) instead
    # of remote Neon round-trips. The official pgvector image ships the `vector`
    # extension, which the migration chain (enable_pgvector_extension) requires.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The app constructs its engine from DATABASE_URL at import time, so it must be set.
      # Tests use TEST_DATABASE_URL. The two MUST differ: conftest skips integration when
      # TEST_DATABASE_URL == DATABASE_URL (a DROP SCHEMA safety guard). DATABASE_URL points
      # at the always-present `postgres` db; tests run against the `gca_test` db.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gca_test
      SECRET_KEY: ci-only-secret-key-not-for-production-min-32-chars

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          working-directory: backend

      - name: Install backend dependencies (uv, locked)
        run: uv sync --locked
        working-directory: backend

      - name: Check docs index (guard)
        # Зеркалит тело рецепта `just check-agents-index` прямой командой, а не
        # зовёт `just`: в обоих workflow `just` не упоминается ни разу, все шаги
        # вызывают инструменты напрямую, и установка `just` дала бы новый способ
        # упасть ДО запуска стража.
        #
        # Шаг стоит первым среди проверок: он read-only, не требует Postgres и
        # идёт секунды, а набор тестов — семь минут. Дрейф документации незачем
        # узнавать после них.
        run: uv run --locked python scripts/check_agents_index.py
        working-directory: backend

      - name: Lint (ruff)
        run: uv run --locked ruff check .
        working-directory: backend

      - name: Check ORM/DB drift (alembic check)
        # Гоняется против gca_test (TEST_DATABASE_URL), а НЕ против `postgres`:
        # ту базу workflow намеренно держит немигрированной — на этом стоит
        # защита conftest, сравнивающая две цели. Накат на gca_test безвреден,
        # conftest делает то же самое перед тестами.
        #
        # ГРАНИЦА: шаг сторожит состав колонок, типы и индексы. CHECK- и
        # Computed-выражения он НЕ сравнивает — замерено на Ф1: при подмене обоих
        # autogenerate возвращает пустой diff и лишь UserWarning про Computed
        # (сам UserWarning не роняет прогон). За выражения отвечают parity-тесты
        # в test_schema_constraints.py.
        run: |
          uv run --locked alembic upgrade head
          uv run --locked alembic check
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gca_test

      - name: Run backend tests (unit + integration)
        # conftest applies Alembic to head on TEST_DATABASE_URL once per session;
        # pgvector image makes CREATE EXTENSION vector succeed.
        #
        # -n 12 согласован с локальным рецептом test-backend-parallel (DoD спеки
        # pytest-parallel-workers: локально и в CI один прогон). Каждый xdist-воркёр
        # создаёт себе базу gca_gw<N>_test и мигрирует её сам — сервису достаточно
        # заранее существующей gca_test для db-test-check.
        run: uv run --locked pytest -n 12
        working-directory: backend
