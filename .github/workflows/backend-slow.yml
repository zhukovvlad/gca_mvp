name: backend-slow

# Две медленные группы бэкенд-набора, вынесенные из backend-tests (14.11.2026,
# репозиторий приватный, раннер 2 ядра, лимит Actions 2000 минут в месяц):
#
# - migration_roundtrip — upgrade/downgrade цепочки Alembic на scratch-базе,
#   минуты на тест; проверяют миграции, поэтому запускаются, когда меняются
#   миграции, модели или сами эти тесты;
# - review_tooling — тесты скрипта ревью scripts/enumerate_review_units.py
#   (настоящий git в подпроцессах), не продукт.
#
# Вместе ~169 тестов и около половины времени полного набора. Полный набор
# локально по-прежнему `just test-backend-parallel`; ручной запуск этого
# workflow — workflow_dispatch.

on:
  pull_request:
    paths:
      - "backend/alembic/**"
      - "backend/models.py"
      - "backend/tests/conftest.py"
      - "backend/tests/comparison_fixtures.py"
      - "backend/tests/integration/*_schema.py"
      - "backend/scripts/enumerate_review_units.py"
      - "backend/tests/unit/test_enumerate_review_units.py"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/backend-slow.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-slow:
    # Образ раннера закреплён, а не ubuntu-latest: Postgres берётся из образа
    # (шаг «Start PostgreSQL» ниже), и его версия и имя пакета pgvector
    # не должны меняться вместе с переездом ubuntu-latest на новую систему.
    runs-on: ubuntu-24.04
    # Миграционные тесты идут минутами каждый, на 2 ядрах — до ~10 минут на
    # самый долгий (замер локально под нагрузкой — 580 с). Ограничение —
    # чтобы взаимная блокировка не повесила job на дефолтные 6 часов.
    timeout-minutes: 40

    # Postgres + pgvector on the runner itself → localhost queries (~0.1ms) instead
    # of remote Neon round-trips. The migration chain (enable_pgvector_extension,
    # HNSW index) needs pgvector >= 0.5.
    #
    # Postgres — тот, что предустановлен в образе раннера, а не сервис-контейнер
    # pgvector/pgvector из Docker Hub: анонимное скачивание образа упиралось в
    # лимит Docker Hub на общий адрес раннеров (`toomanyrequests`, job падал до
    # тестов три раза подряд 10.10.2026), а вход в Docker Hub привязал бы рабочий
    # репозиторий к личному аккаунту. Здесь нет ни реестра, ни секретов.

    env:
      # The app constructs its engine from DATABASE_URL at import time, so it must be set.
      # Tests use TEST_DATABASE_URL. The two MUST differ: conftest skips integration when
      # TEST_DATABASE_URL == DATABASE_URL (a DROP SCHEMA safety guard). DATABASE_URL points
      # at the always-present `postgres` db; tests run against the `gca_test` db.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gca_test
      SECRET_KEY: ci-only-secret-key-not-for-production-min-32-chars

    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL 16 with pgvector (runner image)
        # Postgres 16 предустановлен в ubuntu-24.04, служба выключена; pgvector —
        # пакет postgresql-16-pgvector из apt (0.6+ — HNSW есть). Пароль и база
        # gca_test — те же, что задавал прежний сервис-контейнер, поэтому
        # DATABASE_URL / TEST_DATABASE_URL ниже не меняются.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16-pgvector
          dpkg-query -W postgresql-16 postgresql-16-pgvector
          sudo systemctl start postgresql.service
          until pg_isready -h localhost -p 5432; do sleep 1; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "ALTER USER postgres PASSWORD 'postgres';" \
            -c "CREATE DATABASE gca_test;"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          working-directory: backend

      - name: Install backend dependencies (uv, locked)
        run: uv sync --locked
        working-directory: backend

      - name: Run slow backend groups (migration_roundtrip, review_tooling)
        run: uv run --locked pytest -n 2 -m "migration_roundtrip or review_tooling"
        working-directory: backend
