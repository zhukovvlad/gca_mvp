name: frontend-tests

on:
  # Только PR: прогон на push в main после мержа повторял бы уже пройденный
  # прогон PR и удваивал расход минут (репозиторий приватный с 14.11.2026,
  # лимит Actions — 2000 минут в месяц). Ручной запуск — workflow_dispatch.
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"
  workflow_dispatch:

# Новый пуш в тот же PR снимает незаконченный прогон старого коммита.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    # Vitest уже ловил сценарий бесконечного зависания (MSW blob-перехват под node 20);
    # ограничиваем job, чтобы регресс не жёг 6ч GitHub-дефолта.
    timeout-minutes: 20

    # Все шаги — из frontend/ (пакет живёт там; зеркалит `cd frontend && ...` из justfile).
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Единый источник версии node — frontend/.nvmrc (engines.node в package.json
          # держит тот же baseline; README — «Node.js 24+»). На node 20 перехват blob-
          # ответа в MSW (axios responseType:"blob" через jsdom XHR) зависает — это
          # несовместимость ТЕСТ-инфры, не баг приложения (в браузере XHR blob работает).
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npx tsc -b --noEmit

      - name: Run frontend tests (vitest)
        # `npm test` = `vitest --run` (одноразовый прогон, не watch).
        #
        # --maxWorkers=2: по умолчанию vitest берёт «ядра минус один», и на
        # 2-ядерном раннере приватного репозитория (с 14.11.2026) шёл в ОДИН
        # поток — 514 с против 200 с на 4 ядрах (PR #79 против PR #78).
        run: npm test -- --maxWorkers=2
