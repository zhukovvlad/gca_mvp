<style>

*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit;font-size:14px;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}
input,select,textarea{font-family:inherit;font-size:14px}
.top{height:56px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px;padding:0 32px}

.wrap{max-width:1400px;margin:0 auto;padding:24px 32px 64px;display:flex;flex-direction:column;gap:16px}
.head{display:flex;justify-content:space-between;align-items:flex-end}h1{margin:0;font-size:24px;font-weight:600}
.seg{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:8px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:6px;color:var(--muted2)}
.seg button.on{background:#fff;color:var(--text);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.banner{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;font-size:13px}

.banner.hold{background:#eff6ff;border:1px solid #93c5fd;color:#1e3a8a}.banner.hold button{border:1px solid #1d4ed8;background:#fff;color:#1e3a8a}
.banner.info{background:#fff;border:1px solid var(--line);color:var(--muted2)}
.banner button{padding:6px 14px;border-radius:6px;font-weight:500}.banner .acts2{margin-left:auto;display:flex;gap:8px}
.bar{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.tabs{display:flex;border:1px solid #d4d4d8;border-radius:8px;overflow:hidden;background:#fff}
.tabs button{border:0;background:#fff;padding:8px 16px}.tabs button+button{border-left:1px solid #d4d4d8}
.tabs button.on{background:var(--primary);color:var(--on);font-weight:500}.tabs button span{opacity:.6;margin-left:4px}
.filters{display:flex;gap:14px;align-items:center;color:var(--muted2);flex-wrap:wrap}
select,.inp{padding:5px 8px;border:1px solid #d4d4d8;border-radius:6px;background:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}

.gname{font-size:15px;font-weight:600}.gmeta{color:var(--muted);font-size:13px}

.ml{margin-left:auto}
.rows{border-top:1px solid var(--line2);display:none}.open .rows{display:block}
.row{display:flex;gap:16px;padding:12px 16px;align-items:flex-start;border-bottom:1px solid var(--line2)}.row.off{background:#fafafa;opacity:.65}
.row input[type=checkbox]{width:16px;height:16px;margin-top:3px;accent-color:var(--primary)}
.conf{width:44px;font-family:'IBM Plex Mono',monospace;font-size:13px;padding-top:1px}.c-ok{color:var(--ok)}.c-mid{color:var(--mid)}.c-bad{color:var(--bad)}
.rt{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}.sub{font-size:12px;color:var(--muted)}.why{font-size:12px;color:var(--muted2);font-style:italic}
.more{padding:10px 16px 14px 76px;font-size:13px;color:var(--muted)}
.grid{display:grid;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line2);align-items:start}
.grid.h{font-size:12px;color:var(--muted);background:#fafafa;border-bottom:1px solid var(--line);padding:10px 16px}
.gnew{grid-template-columns:70px 280px minmax(0,1fr) 70px 170px}.gerr{grid-template-columns:minmax(0,1fr) 210px 280px 150px}
.gfam{grid-template-columns:minmax(0,1.2fr) 44px 100px minmax(0,2.6fr) 80px;cursor:pointer}.gfam:hover{background:#fafafa}.gfam.sel{background:#f4f4f5}
.hint{font-size:13px;color:var(--muted);max-width:900px;margin-top:12px;line-height:1.5}
.empty{padding:40px;text-align:center;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:16px;align-items:start}
.panel{padding:20px;display:flex;flex-direction:column;gap:16px;position:sticky;top:16px}
.sec{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line2)}.sec:first-of-type{border-top:0;padding-top:0}
.sech{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.f{font-size:11px;padding:1px 6px;border-radius:4px;text-transform:none;letter-spacing:0}.f1{background:#f4f4f5;color:#52525b}.f2{background:#ede9fe;color:#5b21b6}
.kvl{display:grid;grid-template-columns:170px minmax(0,1fr);gap:6px 12px;font-size:14px}.kvl>div:nth-child(odd){color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.flags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}

.mem{font-size:13px;display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:4px 10px}
.budget{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted2)}.meter{width:120px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.meter i{display:block;height:100%;background:#16a34a}

.ov{position:fixed;inset:0;background:rgba(9,9,11,.45);display:none;align-items:center;justify-content:center;z-index:4}.ov.show{display:flex}

.dlg label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted2)}

.acts{display:flex;gap:8px;justify-content:flex-end}.acts .ghost{padding:8px 14px;font-size:14px}

  <div class="note">Выбор явный: разделение без правила при следующем импорте вернёт позиции в старый контекст.</div>
  <div class="acts"><button type="button" class="ghost" onclick="closeDlg()">Отмена</button><button type="button" class="primary" onclick="closeDlg();toast('Контекст разделён. Оба контекста сверены с очередью модели.')">Разделить</button></div>`); }
function archiveCtx(id) { const c = C(id); const reasons = []; if (c.members) reasons.push(`в контексте ${c.members} членств — сначала перенесите их`);
  if (reasons.length) { dlg(`<h2>Архивировать нельзя</h2><p>${reasons.join('; ')}.</p><div class="note">Предусловия: контекст пуст, входящих правил нет, у контекста по умолчанию указан новый. Каждое даёт свой отказ со своим числом.</div><div class="acts"><button type="button" class="primary" onclick="closeDlg()">Понятно</button></div>`); return; }
  S.ctx = S.ctx.filter((x) => x.id !== id); S.ctxSel = S.ctx[0].id; render(); toast('Контекст в архиве. Восстановления в фиче 1 нет.'); }

/* ---------- Предложения ---------- */
function visibleGroups() { const u = S.fu || '', b = S.fb || '', m = !!S.fm; return S.groups.filter((g) => !S.done[g.id] && (!u || g.unit === u) && (!b || g.band === b) && (!m || g.multi > 0)); }
function visibleNews() { const u = S.fu || ''; return S.news.filter((n) => !S.created[n.id] && (!u || n.unit === u)); }
function pageSug() {
  const pct = Math.min(100, S.spent / 30 * 100);
  let h = `<div style="display:flex;align-items:center;gap:16px"><div class="budget ml">Расход за 24 ч <div class="meter"><i style="width:${pct}%"></i></div> <b style="color:var(--text)">$${S.spent.toFixed(2).replace('.', ',')}</b> из $30</div>
    </div>`;
  h += S.held.map((b, i) => `<div class="banner hold">${pauseIcon}<span><b>Удержано:</b> ${esc(b.src)} — ${b.n.toLocaleString('ru')} контекстов, ≈ $${b.cost}</span>
    <div class="acts2"><button type="button" onclick="openHeld(${i})">Поставить…</button><button type="button" onclick="S.held.splice(${i},1);render();toast('Пачка отброшена. Контексты можно поставить позже кнопкой единицы.')">Отбросить</button></div></div>`).join('');
  if (S.config) h += `<div class="banner warn">${warnIcon}<span><b>Конфигурация изменена</b> (версия промпта 3 → 4). Устарели все 4 380 опубликованных предложений, оценка перезапроса — <b>$18,40</b>.</span><div class="acts2"><button type="button" onclick="toast('Preview: 4 380 контекстов, $18,40, суточный бюджет — остаток $25,80. Требует подтверждения admin.')">Перезапросить всё…</button></div></div>`;
  h += S.stale.map((s, i) => `<div class="banner warn">${warnIcon}<span><b>${s.unit}:</b> список семей изменён, устарело ${s.n} предложений (≈ $${s.cost})</span><div class="acts2"><button type="button" onclick="openReask(${i})">Перезапросить ${s.unit}…</button></div></div>`).join('');
  const listN = S.groups.filter((g) => !S.done[g.id]).reduce((a, g) => a + g.total, 0);
  const t = [['list','Семья из списка',listN],['new','Новая',visibleNews().length],['err','Ошибки',S.errors.length]];
  h += `<div class="bar"><div class="tabs">${t.map(([k, l, n]) => `<button type="button" class="${S.tab === k ? 'on' : ''}" onclick="S.tab='${k}';render()">${l}<span>${n}</span></button>`).join('')}</div>
    <div class="filters"><label>Единица <select onchange="S.fu=this.value;render()">${['','м²','м','шт','мес'].map((v) => `<option value="${v}" ${S.fu === v ? 'selected' : ''}>${v || 'все'}</option>`).join('')}</select></label>
    ${S.tab === 'list' ? `<label>Уверенность <select onchange="S.fb=this.value;render()">${[['','все полосы'],['ok','≥ 0,9'],['mid','0,7–0,9'],['bad','< 0,7']].map(([v, l]) => `<option value="${v}" ${S.fb === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label><input type="checkbox" ${S.fm ? 'checked' : ''} onchange="S.fm=this.checked;render()"> только многовладельческие</label>` : ''}</div></div>`;
  h += S.tab === 'list' ? viewList() : S.tab === 'new' ? viewNew() : viewErr();
  return h;
}
function viewList() {
  const gs = visibleGroups();
  if (!gs.length) return '<div class="card empty">В этой очереди при текущих фильтрах пусто.</div>';
  return '<div style="display:flex;flex-direction:column;gap:12px">' + page('list', gs).map((g) => {
    const rows = g.rows.filter((r) => !S.rejected[r.id]); const checked = rows.filter((r) => !S.off[r.id]).length + g.hidden;
    return `<div class="card ${S.open[g.id] ? 'open' : ''}"><div class="ghead"><button type="button" class="chev" aria-label="Раскрыть группу" onclick="S.open['${g.id}']=!S.open['${g.id}'];render()">${chev}</button>
      <span class="gname">${esc(g.family)}</span><span class="gmeta">${g.unit} · ${g.total}</span><span class="pill ${g.band}">${bandTxt[g.band]}</span>
      <button type="button" class="primary ml" onclick="confirmGroup('${g.id}')">Подтвердить отмеченные ${checked}</button></div>
      <div class="rows">${rows.map((r) => `<div class="row ${S.off[r.id] ? 'off' : ''}"><input type="checkbox" aria-label="Отметить строку" ${S.off[r.id] ? '' : 'checked'} onchange="S.off['${r.id}']=!this.checked;render()">
        <div class="conf c-${band(r.conf)}">${fmt(r.conf)}</div><div class="rt"><div>${esc(r.title)}</div><div class="sub one" title="${esc(r.chain)}">${clf(r.art)} ${est(r.chain)}</div><div class="why">Пояснение ИИ: ${esc(r.why)}</div></div>
        <div style="display:flex;gap:6px;flex-shrink:0"><button type="button" class="ghost" onclick="openOther('${g.id}','${r.id}')">Другая семья…</button><button type="button" class="ghost" onclick="reject('${r.id}')">Отклонить</button></div></div>`).join('')}
      ${g.hidden ? `<div class="more">… и ещё ${g.hidden}, отмечены</div>` : ''}</div></div>`;
  }).join('') + `<div class="card" style="overflow:hidden">${pager('list', gs.length)}</div></div>`;
}
function viewNew() {
  const ns = visibleNews();
  const body = ns.length ? page('new', ns).map((n) => n.nocand
    ? `<div class="grid gnew" style="background:#fafafa"><div style="color:var(--muted2)">${n.unit}</div><div class="sub" style="font-size:13px">в единице нет активных семей — ИИ не спрашивали</div><div class="rt"><div>${esc(n.title)}</div><div class="sub">${est(n.chain)}</div></div><div class="conf sub">—</div><div><button type="button" class="outline" onclick="openCreate('${n.id}')">Завести семью…</button></div></div>`
    : `<div class="grid gnew"><div style="color:var(--muted2)">${n.unit}</div><div style="font-weight:500">${esc(n.name)}</div><div class="rt"><div>${esc(n.title)}</div><div class="sub">${est(n.chain)}</div></div><div class="conf">${fmt(n.conf)}</div><div><button type="button" class="outline" onclick="openCreate('${n.id}')">Завести семью…</button></div></div>`).join('') : '<div class="empty">Пусто.</div>';
  return `<div class="card" style="overflow:hidden"><div class="grid gnew h"><div>Единица</div><div>Имя от ИИ</div><div>Наименование строки</div><div>Уверен.</div><div></div></div>${body}${pager('new', ns.length)}</div>
  <div class="hint">Заведите семью из любой строки и перезапросите единицу — похожие строки придут в «Семья из списка» одной группой.</div>`;
}
function viewErr() {
  return `<div class="card" style="overflow:hidden"><div class="grid gerr h"><div>Контекст</div><div>Класс ошибки</div><div>Состояние</div><div></div></div>` +
    page('err', S.errors).map((e) => `<div class="grid gerr"><div>${esc(e.ctx)}</div><div>${e.cls}</div><div style="color:var(--muted2)">${e.state}</div><div><button type="button" class="ghost" onclick="retry('${e.id}')">${e.btn}</button></div></div>`).join('') +
    (S.errors.length ? '' : '<div class="empty">Ошибок нет.</div>') + pager('err', S.errors.length) + '</div>';
}
function confirmGroup(id) {
  const g = S.groups.find((x) => x.id === id); const rows = g.rows.filter((r) => !S.rejected[r.id]);
  const n = rows.filter((r) => !S.off[r.id]).length + g.hidden; const left = rows.filter((r) => S.off[r.id]);
  S.done[id] = true; S.spent += 0;
  if (left.length) { S.groups.push({id: id + 'x', family: g.family, unit: g.unit, total: left.length, multi: 0, band: g.band, hidden: 0, rows: left.map((r) => Object.assign({}, r, {id: r.id + 'x'}))}); S.open[id + 'x'] = true; }
  const f = S.fam.find((x) => x.name === g.family); if (f) f.bound += n;
  render(); toast(`${n} контекстов получили семью «${g.family}».` + (left.length ? `\nСнятые (${left.length}) остались в очереди отдельной группой: назначьте им другую семью или отклоните.` : ''));
}
function reject(rid) { S.rejected[rid] = true; render(); toast('Предложение отклонено. Контекст остаётся без семьи.'); }
function openOther(gid, rid) { const g = S.groups.find((x) => x.id === gid); const r = g.rows.find((x) => x.id === rid);
  const opts = activeFam(g.unit).filter((f) => f !== g.family).map((f) => `<option>${esc(f)}</option>`).join('');
  dlg(`<h2>Другая семья</h2><p>${esc(r.title)}</p>${opts ? `<label>Активные семьи ${g.unit}<select id="otherSel">${opts}</select></label>` : `<p>Других активных семей ${g.unit} нет.</p>`}
    <div class="note">Назначение идёт тем же путём, что ручное в фиче 1: единица должна совпасть, семья — активна.</div>
    <div class="acts"><button type="button" class="ghost" onclick="closeDlg()">Отмена</button>${opts ? `<button type="button" class="primary" onclick="doOther('${rid}')">Назначить</button>` : ''}</div>`); }
function doOther(rid) { const f = $('otherSel').value; S.rejected[rid] = true; closeDlg(); render(); toast(`Назначена семья «${f}».`); }
function openHeld(i) { const b = S.held[i]; dlg(`<h2>Поставить удержанную пачку?</h2><p>${esc(b.src)}</p>
  <div class="kv"><div>Контекстов</div><div><b>${b.n.toLocaleString('ru')}</b></div><div>Резерв</div><div><b>$${b.cost}</b></div><div>Остаток бюджета за 24 ч</div><div><b>$${(30 - S.spent).toFixed(2).replace('.', ',')}</b></div></div>
  <div class="note">Задания ставятся по текущим отпечаткам входа, а не по сохранённым в момент импорта. Если бюджета не хватит, часть заданий подождёт следующих суток.</div>
  <div class="acts"><button type="button" class="ghost" onclick="closeDlg()">Отмена</button><button type="button" class="primary" onclick="S.held.splice(${i},1);closeDlg();render();toast('Пачка поставлена в очередь.')">Поставить</button></div>`); }
function openReask(i) { const s = S.stale[i]; dlg(`<h2>Перезапросить ${s.unit}?</h2><p>Модель заново выберет семью для <b>${s.n}</b> контекстов единицы ${s.unit}, у которых нет семьи, назначенной человеком. Подтверждённые контексты не трогаются.</p>
  <div class="kv"><div>Контекстов</div><div><b>${s.n}</b></div><div>Оценка стоимости</div><div><b>$${s.cost}</b></div><div>Активных семей ${s.unit}</div><div><b>${activeFam(s.unit).length || s.fam}</b></div></div>
  <div class="acts"><button type="button" class="ghost" onclick="closeDlg()">Отмена</button><button type="button" class="primary" onclick="doReask(${i})">Поставить в очередь</button></div>`); }
function doReask(i) {
  const s = S.stale.splice(i, 1)[0]; closeDlg(); S.spent += parseFloat(s.cost.replace(',', '.'));
  if (S.newFamily && S.newFamily.unit === s.unit) {
    const nf = S.newFamily; S.news.filter((n) => n.kind === 'hydro').forEach((n) => { S.created[n.id] = true; });
    S.groups.unshift({id: 'gh', family: nf.name, unit: s.unit, total: 3, multi: 1, band: 'ok', hidden: 0, rows: [
      {id:'gh1',conf:.96,title:'Гидрошпонка ТЕХНОНИКОЛЬ Фундамент ТПС-В-140-1',chain:'Подземная часть / Деформационные швы',art:'3.5',why:`Гидрошпонка — семья «${nf.name}» по определению.`},
      {id:'gh2',conf:.95,title:'Гидрошпонка наружная ПВХ 240 мм',chain:'Подземная часть / Гидроизоляция швов бетонирования',art:'3.5',why:'Гидрошпонка любого типа входит в семью.'},
      {id:'gh3',conf:.93,title:'Шпонка гидроизоляционная ДШ-320',chain:'Паркинг / Деформационные швы',art:'3.5',why:'Та же работа, другое написание.'}]});
    S.open.gh = true; S.newFamily = null; S.tab = 'list'; render();
    toast(`${s.n} заданий выполнено (${s.unit}).\nТри гидрошпонки под тремя разными именами теперь одной группой в «Семья из списка».`); return;
  }
  render(); toast(`${s.n} заданий поставлено в очередь (${s.unit}).`);
}
function openCreate(nid) { const n = S.news.find((x) => x.id === nid);
  const def = n.kind === 'hydro' ? 'Входит: гидрошпонки всех типов в швах бетонирования и деформационных швах. Не входит: гидроизоляция швов мастиками и лентами.' : '';
  dlg(`<h2>Новая семья</h2><p style="font-size:13px;color:var(--muted)">Из строки: «${esc(n.title)}»</p><label>Имя<input type="text" id="crName" value="${esc(n.name || '')}"></label>
    <div style="display:flex;gap:12px;align-items:center;font-size:13px;color:var(--muted2)">Единица <span class="pill gray" style="font-size:13px">${n.unit}</span><span class="sub">берётся из строки, одна на семью</span></div>
    <label>Определение — обязательно для активации<textarea id="crDef" rows="4" placeholder="Входит: … Не входит: …">${def}</textarea></label>
    <div class="acts"><button type="button" class="ghost" onclick="closeDlg()">Отмена</button><button type="button" class="ghost" onclick="saveDraft('${nid}')">Сохранить черновик</button><button type="button" class="primary" onclick="activate('${nid}')">Сохранить и активировать</button></div>`); }
function saveDraft(nid) { const n = S.news.find((x) => x.id === nid); const nm = $('crName').value || 'Без имени'; S.fam.unshift({id: Date.now(), name: nm, unit: n.unit, status: 'draft', def: $('crDef').value, bound: 0, src: 'manual'}); closeDlg(); render(); toast(`Черновик «${nm}» на вкладке «Семьи».`); }
function activate(nid) { const n = S.news.find((x) => x.id === nid); const nm = $('crName').value.trim(), def = $('crDef').value.trim();
  if (!nm) { toast('Нужно имя.'); return; } if (!def) { toast('Без определения семью активировать нельзя: модели нечем отличить её от соседних.'); return; }
  closeDlg(); S.fam.unshift({id: Date.now(), name: nm, unit: n.unit, status: 'active', def, bound: 0, src: 'manual'}); S.newFamily = {name: nm, unit: n.unit};
  if (n.kind !== 'hydro') S.created[nid] = true;
  S.stale = [{unit: n.unit, n: 82, cost: '0,34', fam: activeFam(n.unit).length}].concat(S.stale.filter((s) => s.unit !== n.unit)); render();
  toast(`Семья «${nm}» активна и видна на вкладке «Семьи».\nЕдиница ${n.unit} помечена сверху: перезапросите её, и остальные строки этой работы выберут новую семью.`); }
function retry(eid) { S.errors = S.errors.filter((e) => e.id !== eid); render(); toast('Задание возвращено в очередь, бюджет попыток сброшен. История прежних попыток сохранена.'); }
render();
</script>
</body>
</html>
